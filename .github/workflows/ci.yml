name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore backend/ServiceDesk.sln
      - name: Build
        run: dotnet build backend/ServiceDesk.sln --no-restore -c Release
      - name: Test with coverage
        run: dotnet test backend/ServiceDesk.sln --no-build -c Release --collect:"XPlat Code Coverage"
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: "**/coverage.cobertura.xml"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npx ng test --watch=false --browsers=ChromeHeadless
